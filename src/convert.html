<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; font-src 'self' data:; connect-src 'none'" />
<title>格式转换</title>
<link rel="stylesheet" href="note.css" />
<style>
  :root {
    --bg: #F6F7F9;
    --fg: #1F2328;
    --muted: #6B7280;
    --line: #E3E6EA;
    --card: #FFFFFF;
    --accent: #2F6FED;
    --warn: #B45309;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0; height: 100%;
    background: var(--bg); color: var(--fg);
    font-family: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", system-ui, sans-serif;
    font-size: 14px;
  }
  body { display: flex; flex-direction: column; overflow: hidden; }
  header {
    padding: 16px 18px 10px;
    border-bottom: 1px solid var(--line);
    background: var(--card);
  }
  h1 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .sub { color: var(--muted); font-size: 12px; word-break: break-all; }
  .files { margin-top: 6px; font-size: 12px; color: var(--muted); }
  .files b { color: var(--fg); font-weight: 600; }
  main { flex: 1; overflow-y: auto; padding: 12px 18px; }
  .section-title {
    font-size: 12px; color: var(--muted); margin: 4px 0 8px;
    text-transform: none; letter-spacing: .02em;
  }
  .grid { display: flex; flex-wrap: wrap; gap: 8px; }
  .fmt {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-width: 82px; padding: 10px 12px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    cursor: pointer; user-select: none;
    transition: border-color .12s, background .12s, transform .12s;
  }
  .fmt:hover { border-color: var(--accent); background: #F0F5FF; }
  .fmt:active { transform: scale(.97); }
  .fmt .id { font-weight: 600; text-transform: uppercase; font-size: 13px; }
  .fmt .name { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .fmt.disabled { opacity: .5; cursor: not-allowed; }
  .fmt.disabled:hover { border-color: var(--line); background: var(--card); }
  .fmt.disabled .name { color: var(--warn); }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; }
  /* PDF → 图片/文本 才出现的「全部页」选项；[hidden] 必须显式覆盖 display */
  .all-pages {
    display: inline-flex; align-items: center; gap: 6px;
    margin-top: 12px; padding: 8px 10px;
    color: var(--muted); font-size: 12px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--card);
    cursor: pointer; user-select: none;
  }
  .all-pages[hidden] { display: none; }
  .all-pages input:disabled { cursor: default; opacity: .6; }
  footer {
    padding: 10px 18px; border-top: 1px solid var(--line);
    background: var(--card); font-size: 12px; color: var(--muted);
    /* 状态栏在上、进度条在下（PRD 5.4 DOM 契约）⇒ 纵向排列 */
    display: flex; flex-direction: column; align-items: stretch; gap: 0; min-height: 42px;
  }
  .status { flex: 1; }
  .status.err { color: #B42318; }
  .status.ok { color: #067647; }
  /* 成功但有警告（例如产物全透明）：橙黄，既不是红色报错也不是绿色全好 */
  .status.warn { color: #B54708; }
  .busy { color: var(--muted); }
  .hint { margin-top: 10px; font-size: 11px; color: var(--muted); line-height: 1.6; }
  /* 进度条是**独立元素**，不参与 .status 的 class 体系（四态互斥不受影响） */
  .progress {
    display: flex; align-items: center; gap: 8px;
    width: 100%; margin-top: 6px;
  }
  /* ★ [hidden] 必须显式 display:none —— 与 .all-pages[hidden] 同一坑：
     .progress 有 display:flex，不写这条规则时 hidden 属性不生效（元素仍可见）。 */
  .progress[hidden] { display: none; }
  .progress-fill {
    flex: 1; height: 4px; border-radius: 2px;
    background: var(--accent);
    width: 0%;
    transition: width .12s linear;
  }
  .progress-pct {
    min-width: 34px; text-align: right;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .pdf-translate-box {
    margin-top: 16px;
    padding-top: 12px;
    border-top: 1px solid var(--border);
  }
  .pdf-translate-box[hidden] { display: none; }
  .pdf-trans-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 8px;
  }
  .pdf-trans-head .section-title { margin: 0; }
  .pdf-trans-sub {
    font-size: 11px;
    color: var(--muted);
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .trans-grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 8px;
  }
  .trans-card {
    appearance: none;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 8px;
    font: inherit;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--text);
    cursor: pointer;
    text-align: center;
    transition: border-color .14s, background .14s, transform .12s;
  }
  .trans-card:hover:not(:disabled) {
    border-color: var(--accent);
    background: rgba(91, 134, 229, .08);
    transform: translateY(-1px);
  }
  .trans-card:disabled { opacity: .5; cursor: not-allowed; }
  .trans-cancel {
    appearance: none;
    border: 1px solid rgba(192, 57, 43, .35);
    background: rgba(192, 57, 43, .08);
    color: #b42318;
    border-radius: 6px;
    padding: 2px 8px;
    font: inherit;
    font-size: 11px;
    cursor: pointer;
  }
  .trans-cancel[hidden] { display: none; }
</style>
</head>
<body>
  <header>
    <h1>转换为</h1>
    <div class="sub" id="subtitle">等待文件…</div>
    <div class="files" id="files"></div>
  </header>

  <main>
    <div class="section-title" id="available-title">可用格式</div>
    <div class="grid" id="available"></div>

    <div class="section-title" id="engine-title" style="margin-top:16px">需要额外引擎（可选）</div>
    <div class="grid" id="needs-engine"></div>

    <label class="all-pages" id="allPagesWrap" hidden>
      <input type="checkbox" id="allPages" /> 转换所有页面
    </label>

    <section class="pdf-translate-box" id="pdfTranslateSection" hidden>
      <div class="pdf-trans-head">
        <div class="section-title">文献翻译（公式排版保留）</div>
        <span class="pdf-trans-sub" id="pdfTransEnvSub"></span>
        <button type="button" class="trans-cancel" id="pdfTransBoxCancel" hidden>取消</button>
      </div>
      <div class="trans-grid">
        <button type="button" class="trans-card" id="pdfTransDualBtn" data-mode="dual">双语对照 PDF</button>
        <button type="button" class="trans-card" id="pdfTransMonoBtn" data-mode="mono">纯译文 PDF</button>
      </div>
    </section>

    <div class="hint" id="hint"></div>
  </main>

  <footer>
    <div class="status" id="status"></div>
    <div class="progress" id="progress" hidden>
      <div class="progress-fill" id="progressFill"></div>
      <span class="progress-pct" id="progressPct">0%</span>
    </div>
  </footer>

  <script src="guard.js"></script>
  <script src="../lib/utils.js"></script>
  <script src="convert.js"></script>
</body>
</html>
