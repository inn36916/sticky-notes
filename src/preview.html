<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data: blob: sticky-att:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'" />
<title>查看图片</title>
<link rel="stylesheet" href="preview.css" />
</head>
<body>

    <img id="img" class="img" alt="" draggable="false" />

    <button class="btn" id="close">关闭</button>
  </div>

<script src="guard.js"></script>
<script src="../lib/utils.js"></script>
<script src="preview.js"></script>
</body>
</html>
