<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'none'" />
<title>截图</title>
<link rel="stylesheet" href="capture.css" />
</head>
<body data-phase="select">
  <!-- 鼠标悬停时的候选区域（自动识别窗口边界） -->
  <div id="hoverSel" class="hover-sel" hidden>
    <span class="hover-size" id="hoverSize">0 × 0</span>
  </div>

  <!-- 选区：box-shadow 铺满全屏做遮罩，选区内部镂空，看到的是实时桌面 -->
  <div id="sel" class="sel" hidden>
    <div class="sel-size" id="selSize">0 × 0</div>
    <canvas id="draw" class="draw"></canvas>
    <i class="h nw" data-h="nw"></i><i class="h n" data-h="n"></i><i class="h ne" data-h="ne"></i>
    <i class="h w" data-h="w"></i><i class="h e" data-h="e"></i>
    <i class="h sw" data-h="sw"></i><i class="h s" data-h="s"></i><i class="h se" data-h="se"></i>
  </div>

  <!-- 吸附参考线 -->
  <div class="snap-line v" id="snapV" hidden></div>
  <div class="snap-line h" id="snapH" hidden></div>

  <!-- 顶部提示 -->
  <div class="hint" id="hint">
    <b>移动鼠标</b>自动识别窗口 · <b>单击</b>直接截取 · <b>拖拽</b>自定义区域 · <b>Esc</b>取消
  </div>

  <!-- 放大镜坐标提示（拖动时跟随光标） -->
  <div class="crosshair-info" id="crossInfo" hidden></div>

  <!-- 标注工具栏 -->
  <div class="toolbar" id="toolbar" hidden>
    <div class="tb-group" id="toolsGroup" data-annotate>
      <button class="tool active" id="toolMove" data-tool="move" title="移动/调整选区">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M7.5 9V4.6a1.4 1.4 0 0 1 2.8 0V9m0-1.4a1.3 1.3 0 0 1 2.6 0V9m0-.8a1.3 1.3 0 0 1 2.6 0v4.2c0 2.8-1.8 4.6-4.4 4.6-2 0-3-.8-4.2-2.4L4.4 11a1.3 1.3 0 0 1 1.9-1.8L7.5 11"/>
        </svg>
      </button>
      <button class="tool" data-tool="rect" title="矩形 (R)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="3" y="4.5" width="14" height="11" rx="1.6"/></svg>
      </button>
      <button class="tool" data-tool="ellipse" title="椭圆 (O)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7"><ellipse cx="10" cy="10" rx="7" ry="5.5"/></svg>
      </button>
      <button class="tool" data-tool="arrow" title="箭头 (A)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 16 16 4M9 4h7v7"/></svg>
      </button>
      <button class="tool" data-tool="pen" title="画笔 (P)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3.5 16.5l1-3.6 8-8a2 2 0 0 1 2.8 2.8l-8 8-3.8.8Z"/><path d="M11 5.5l3.5 3.5"/></svg>
      </button>
      <button class="tool" data-tool="mosaic" title="马赛克 (M)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="3" width="4.6" height="4.6"/><rect x="12.4" y="3" width="4.6" height="4.6"/><rect x="7.7" y="7.7" width="4.6" height="4.6"/><rect x="3" y="12.4" width="4.6" height="4.6"/><rect x="12.4" y="12.4" width="4.6" height="4.6"/></svg>
      </button>
      <button class="tool" data-tool="text" title="文字 (T)">
        <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M4.5 5h11M10 5v10.5M7.5 15.5h5"/></svg>
      </button>
    </div>

    <span class="vsep" data-annotate></span>

    <div class="colors" id="colors" data-annotate></div>
    <label class="mini-color" title="自定义颜色" data-annotate>
      <input type="color" id="customColor" value="#ff3b30" />
      <span>+</span>
    </label>

    <span class="vsep" data-annotate></span>

    <label class="rng" id="widthRow" data-annotate><span>粗细</span><input type="range" id="lineWidth" min="1" max="14" value="3" /></label>
    <label class="rng" id="sizeRow" data-annotate><span>字号</span><input type="range" id="fontSize" min="12" max="56" value="20" /></label>

    <span class="vsep" data-annotate></span>

    <button class="act" data-act="undo" data-annotate title="撤销 (Ctrl+Z)" disabled>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M7 6.5H3.5V3M3.8 6.4A7 7 0 1 1 3 11.4"/></svg>
    </button>
    <button class="act" data-act="redo" data-annotate title="重做 (Ctrl+Y)" disabled>
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M13 6.5h3.5V3M16.2 6.4A7 7 0 1 0 17 11.4"/></svg>
    </button>

    <span class="vsep" data-annotate></span>

    <button class="act" data-act="reselect" data-annotate title="重新框选">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 10a6 6 0 1 1 1.9 4.4M4 14.6V10h4.6"/></svg>
    </button>

    <span class="vsep"></span>

    <button class="act ghost" data-act="cancel">取消</button>

    <button class="act icon" data-act="copy" title="复制到剪贴板 (Ctrl+C)">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="7" y="7" width="9.6" height="9.6" rx="1.7"/><path d="M13 7V4.7A1.7 1.7 0 0 0 11.3 3H4.7A1.7 1.7 0 0 0 3 4.7v6.6A1.7 1.7 0 0 0 4.7 13H7"/></svg>
    </button>
    <button class="act icon" data-act="save" title="保存到文件 (Ctrl+S)">
      <svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10 3v8.6M6.6 8.4 10 11.8l3.4-3.4"/><path d="M3.6 13.4v1.9A1.7 1.7 0 0 0 5.3 17h9.4a1.7 1.7 0 0 0 1.7-1.7v-1.9"/></svg>
    </button>

    <button class="act primary" data-act="ok">插入便签</button>
  </div>

  <!-- 文字输入 -->
  <textarea id="textInput" class="text-input" spellcheck="false" hidden></textarea>

  <div class="toast" id="toast" hidden></div>

<script src="guard.js"></script>
<script src="../lib/utils.js"></script>
<script src="capture.js"></script>
</body>
</html>
